---
layout: default
---

<main class="post-page">
  <article>
    <header class="post-header">
      <a class="back-link" href="{{ '/' | relative_url }}#{{ page.category }}">← {{ page.category | capitalize }}</a>
      <h1>{{ page.title }}</h1>
      <p class="post-byline">
        <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%B %-d, %Y" }}</time>
      </p>
    </header>

    <div class="post-body">
      {{ content }}
    </div>
  </article>
</main>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ page.title | jsonify }},
  "description": {{ page.description | jsonify }},
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "mainEntityOfPage": {{ page.url | absolute_url | jsonify }},
  "author": {
    "@type": "Person",
    "name": "Ali Taha",
    "url": {{ site.url | jsonify }}
  },
  "publisher": {
    "@type": "Person",
    "name": "Ali Taha"
  }
}
</script>
