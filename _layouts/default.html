<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#f3eee4">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    {% if page.external_url %}
      <meta name="robots" content="noindex, follow">
      <link rel="canonical" href="{{ page.external_url }}">
    {% else %}
      <meta name="robots" content="index, follow">
      <link rel="canonical" href="{{ page.url | absolute_url }}">
    {% endif %}

    {% if page.title %}
      <title>{{ page.title }} — {{ site.title }}</title>
    {% else %}
      <title>{{ site.title }}</title>
    {% endif %}

    <meta property="og:site_name" content="{{ site.title }}">
    <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
    <meta property="og:image" content="{{ '/assets/og.png' | absolute_url }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Ali Taha">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="{{ '/assets/og.png' | absolute_url }}">

    <link rel="icon" href="data:,">
    <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.asset_version }}">
    {% if page.health_dashboard %}
      <link rel="stylesheet" href="{{ '/assets/css/health.css' | relative_url }}?v={{ site.asset_version }}">
    {% endif %}
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <a class="wordmark" href="{{ '/' | relative_url }}">Ali Taha</a>
        <nav aria-label="Primary">
          <a href="https://github.com/AliesTaha" rel="me">GitHub</a>
        </nav>
      </header>

      {{ content }}

      <footer class="site-footer">
        <span>© {{ site.time | date: "%Y" }} Ali Taha</span>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </footer>
    </div>
  </body>
</html>
