---
layout: default
---

<main class="external-page">
  <p class="eyebrow">External article</p>
  <h1>{{ page.title }}</h1>
  {% if page.description %}
    <p>{{ page.description }}</p>
  {% endif %}
  <a class="external-link" href="{{ page.external_url }}">
    Read on {{ page.external_source | default: "the original site" }} ↗
  </a>
</main>
