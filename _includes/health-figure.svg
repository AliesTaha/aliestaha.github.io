    <path d="M101 109C104 120 102 127 96 132C87 135 79 139 74 147"/>
    <path d="M126 109C122 119 125 127 133 132C142 136 148 142 153 151"/>
    <path d="M82 159C80 179 82 200 87 221C91 239 95 253 93 269"/>
    <path d="M143 157C147 177 143 197 138 216C134 231 134 247 138 262"/>
    <path d="M94 137Q112 149 132 139" stroke-width="1.5"/>
